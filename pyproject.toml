[project]
name = "media-dl"
version = "2.1.0"
description = "Unified Media Downloader - Cyan Edition"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Media Downloader Team", email = "dev@media-dl.example"}
]
keywords = ["downloader", "youtube", "tiktok", "spotify", "soundcloud", "aria2c", "cli"]
# La licencia se declara con `license = "MIT"` (PEP 639); añadir aquí un
# clasificador "License ::" hace fallar la instalación con setuptools moderno.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "platformdirs>=4.0.0",
    "httpx>=0.25.0",
    "mutagen>=1.48",
]

[project.optional-dependencies]
spotify = ["spotdl>=4.0.0"]
soundcloud = ["scdl>=1.3.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pyinstaller>=6.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
media-dl = "media_dl.main:cli_main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "T20", "PIE",
    "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "RUF",
    "ASYNC", "Q", "TID", "EXE", "ISC", "ICN", "LOG", "INT", "PERF", "FURB",
]
ignore = [
    # Security rules are opt-in: this is a local CLI that shells out on purpose
    "S101", "S103", "S104", "S105", "S106", "S107", "S306", "S403", "S501",
    "S603", "S607",
    # Rich output is the whole point of the tool
    "T201", "T203",
    # Typer requires function calls in argument defaults
    "B008",
    # Pydantic needs runtime imports; TYPE_CHECKING blocks break resolution
    "TC001", "TC002", "TC003",
    # Complexity budgets: CLI commands legitimately expose many options
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # Lazy imports break circular imports and keep CLI startup fast
    "PLC0415",
    # Singletons (settings, console, registry) are part of the design
    "PLW0603",
    # Exceptions carry long, actionable messages on purpose
    "TRY003", "TRY300", "TRY301",
    # Documented placeholders / intentional reassignment
    "ARG001", "ARG002", "ERA001", "PLW2901", "PTH123",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information
module = [
    "yt_dlp",
    "yt_dlp.*",
    "spotdl",
    "spotdl.*",
    "rich",
    "rich.*",
    "typer",
    "typer.*",
    "platformdirs",
    "platformdirs.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# mutagen ships no stubs at all: every call is untyped, so the strict
# untyped-call rules have to be relaxed for this module only.
module = [
    "mutagen",
    "mutagen.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/media_dl"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["media_dl*"]

[tool.setuptools.package-data]
media_dl = ["py.typed"]