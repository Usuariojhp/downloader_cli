name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo ref si hay commits nuevos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q --no-header

      - name: Cobertura mínima
        run: |
          pytest -q --no-header --cov=src/veluz --cov-report=xml
          # Fallar si la cobertura baja del 65% (actualmente 73%)
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          rate = float(ET.parse("coverage.xml").getroot().get("line-rate", 0)) * 100
          print(f"Cobertura: {rate:.1f}%")
          sys.exit(0 if rate >= 65 else 1)
          PY

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy src/

  build:
    name: Binario portable
    runs-on: ubuntu-latest
    # Solo en master: en cada PR costaría ~2 min y 180 MB de artefacto.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Con los extras: el binario debe traer Spotify y SoundCloud, que
          # es lo que promete el README. Sin 'spotify', spotdl ni siquiera
          # entra y el binario se queda sin esa plataforma.
          python -m pip install -e ".[spotify,soundcloud]" pyinstaller

      - name: Compilar
        run: pyinstaller --clean --noconfirm build/veluz.spec

      - name: Comprobar que arranca
        run: |
          ./dist/veluz --version
          ./dist/veluz doctor

      - name: Comprobar que el binario trae las extensiones
        # Un exclude mal puesto en el spec (websockets, mutagen) rompe el
        # binario entero y no se ve ni con los tests ni con doctor, que
        # siempre salía con 0. Con --strict esto falla si falta algo.
        run: ./dist/veluz doctor --strict

      - uses: actions/upload-artifact@v4
        with:
          name: veluz-linux
          path: dist/veluz
          retention-days: 7

  e2e:
    name: Descarga real (Spotify)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Descargar binario
        uses: actions/download-artifact@v4
        with:
          name: veluz-linux
          path: bin

      - name: Preparar
        run: |
          chmod +x bin/veluz
          mkdir -p test_e2e

      - name: Descarga real de Spotify
        run: |
          cd test_e2e
          ../bin/veluz download audio -F "https://open.spotify.com/track/70LcF31zb1H0PyJoS1Sx1r" -o . 2>&1 | tee download.log
          EXIT=$?
          echo "EXIT_CODE=$EXIT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Verificar carátula
        run: |
          cd test_e2e
          mp3=$(ls *.mp3 2>/dev/null | head -1)
          if [ -z "$mp3" ]; then
            echo "❌ **No se descargó ningún MP3**" >> $GITHUB_STEP_SUMMARY
          else
            python3 ../../scripts/check_cover.py "$mp3"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "====" >> $GITHUB_STEP_SUMMARY
          echo "Log de descarga" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 download.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Asegurar exit 0
        run: exit 0
